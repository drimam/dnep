<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Center Cart Icon Action Bar</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            height: 2500px; /* Demo scroll space */
            padding-bottom: 120px;
        }

        .demo-content {
            padding: 24px 16px;
            color: #495057;
            text-align: center;
        }

        /* =================================================== */
        /* EXPANDED STATE (Fixed Full-Width Bottom Bar)        */
        /* =================================================== */
        .action-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 88px;
            background-color: #ffffff;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 16px;
            border-radius: 0;
            overflow: hidden;
            
            /* Smooth transitions */
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        left 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        bottom 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        border-radius 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Inner Content Row */
        .action-bar-inner {
            width: 100%;
            max-width: 600px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: gap 0.4s ease;
        }

        /* Icon Button Outer Circle */
        .icon-btn {
            position: relative;
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            background-color: #f1f5f9;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            transition: background-color 0.3s ease, width 0.4s ease, height 0.4s ease;
        }

        /* SVG Icon Precise Absolute Centering */
        .icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            /* Perfectly centers the icon relative to icon-btn */
            transform: translate(-50%, -50%) scale(1);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Heart Icon (Default View) */
        .heart-icon {
            fill: none;
            stroke: #334155;
            stroke-width: 2;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Cart Icon (Collapsed View) */
        .cart-icon {
            fill: #334155;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        /* Green Get Quotation Button */
        .quotation-btn {
            flex: 1;
            height: 48px;
            border-radius: 24px;
            background: linear-gradient(180deg, #62c355 0%, #4da741 100%);
            border: none;
            color: #ffffff;
            font-size: 17px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            transition: flex 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        max-width 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease, 
                        padding 0.4s ease;
        }

        /* Sub-text */
        .sub-text {
            margin: 6px 0 0 0;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            white-space: nowrap;
            transition: opacity 0.3s ease, height 0.3s ease, margin 0.3s ease;
        }


        /* =================================================== */
        /* COLLAPSED STATE (Centered Cart Icon in Circle)     */
        /* =================================================== */

        .action-container.collapsed {
            left: calc(100% - 76px); /* 16px offset from right edge */
            bottom: 20px;
            width: 60px;
            height: 60px;
            padding: 0;
            border-radius: 50%;
            box-shadow: -2px 6px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }

        .action-container.collapsed .action-bar-inner {
            gap: 0;
            width: 100%;
            height: 100%;
        }

        /* Expand icon button to fill the entire collapsed circle */
        .action-container.collapsed .icon-btn {
            background-color: transparent;
            width: 100%;
            height: 100%;
            min-width: 100%;
        }

        /* --- Swap Icons with Centering Preserved --- */
        .action-container.collapsed .heart-icon {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
        }

        .action-container.collapsed .cart-icon {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* Strictly Collapse Green Button to Zero Dimensions */
        .action-container.collapsed .quotation-btn {
            flex: 0 0 0px;
            max-width: 0;
            opacity: 0;
            padding: 0;
            margin: 0;
            pointer-events: none;
        }

        /* Completely Hide Sub-text */
        .action-container.collapsed .sub-text {
            opacity: 0;
            height: 0;
            margin: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="demo-content">
        <h2>Scroll Down 👇</h2>
        <p>1. Expanded state: Full-width white background fixed at the bottom.</p>
        <p>2. Collapsed state: Morphs into a circle on the right side with the Cart icon centered inside.</p>
        <p>3. Tap the collapsed circle anytime to reopen.</p>
    </div>

    <!-- Sticky Bottom White Bar -->
    <div class="action-container" id="actionContainer">
        
        <div class="action-bar-inner">
            <!-- Icon Button Container -->
            <button class="icon-btn" aria-label="Action Icon">
                <!-- Heart Icon -->
                <svg class="icon heart-icon" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                
                <!-- Cart Icon -->
                <svg class="icon cart-icon" viewBox="0 0 24 24">
                    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>

            <!-- Main Button -->
            <button class="quotation-btn">
                <span>Get Quotation</span>
            </button>
        </div>
        
        <!-- Subtext -->
        <p class="sub-text">Click here, To Get Final Pricing Quotation</p>
    </div>

    <script>
        let lastScrollY = window.pageYOffset;
        const actionContainer = document.getElementById('actionContainer');
        const scrollThreshold = 40;

        // --- Scroll Listener ---
        window.addEventListener('scroll', () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= scrollThreshold) {
                actionContainer.classList.remove('collapsed');
                lastScrollY = currentScrollY;
                return;
            }

            if (currentScrollY > lastScrollY + 5) {
                actionContainer.classList.add('collapsed');
            } else if (currentScrollY < lastScrollY - 5) {
                actionContainer.classList.remove('collapsed');
            }

            lastScrollY = currentScrollY;
        });

        // --- Tap to Expand ---
        actionContainer.addEventListener('click', (e) => {
            if (actionContainer.classList.contains('collapsed')) {
                e.stopPropagation();
                actionContainer.classList.remove('collapsed');
            }
        });
    </script>
</body>
</html>
